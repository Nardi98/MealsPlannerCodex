version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=mealsdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mealsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # On every compose, wipe + repopulate the DB with testing data, then serve.
    # No `alembic upgrade head` here: the seed rebuilds the schema from the
    # models immediately afterwards, so migrating first would only leave a
    # models-built schema wearing a migrated schema's version stamp -- the exact
    # divergence you would want a local database to reveal. The migrations are
    # exercised by backend/tests/test_migrations.py instead.
    # run python in unbuffered mode (+ louder uvicorn logs)
    command: >
      sh -c "python -u scripts/seed_testing_data.py &&
             python -u -m uvicorn main:app --host 0.0.0.0 --port 8000 --log-level debug"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:pass@db:5432/mealsdb
      # The seed script drops every table, so it refuses to run without this.
      # Compose owns a throwaway database; a deployment must never set it.
      - ALLOW_DESTRUCTIVE_SEED=1
      # Optional: set in your shell / .env to enable "Sign in with Google".
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Auth is fail-closed: JWT_SECRET is required or the app refuses to start.
      # Provide an insecure default for local compose; override in real deploys.
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-secret-change-me}
      # Local dev auth defaults: console mailer (links printed to this log),
      # non-secure cookie over http, and CORS/links pointed at the dev frontend.
      - MAIL_BACKEND=${MAIL_BACKEND:-console}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # The Host headers the app answers to (TrustedHostMiddleware). `*` is safe
      # for local compose, where nobody is forging headers at your laptop. It is
      # NOT safe in a deployment: share URLs fall back to the request Host when
      # PUBLIC_BASE_URL is unset, so a forged Host yields a share link on an
      # attacker's origin that the sharer then forwards, handing over the token.
      # Set both of these to real values in any real deploy.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend-v2:
    build:
      context: ./frontend-v2
      # The Vite dev server. The image's default (final) stage is the nginx
      # production build, which serves a bundle with the VITE_* values baked in
      # -- not what you want while developing.
      target: dev
    environment:
      # Same client ID as the backend; the dev server reads it at startup.
      # Either variable works: compose fans GOOGLE_CLIENT_ID out to the frontend.
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      # The browser (on the host) reaches the backend on the published :8000
      # port. Cross-origin cookies work because backend CORS allows this origin.
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
